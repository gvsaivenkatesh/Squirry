<!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Squirry - Welcome</title>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
        <style>
:root{
    --bg: #fff7f2;
    --card: #ffffff;
    --brand: #ff8a00;
    --brand-600: #f57c00;
    --text: #222222;
    --muted: #6b6b6b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;background:var(--bg);font-family:Poppins,Arial,sans-serif;color:var(--text);overflow-x:hidden;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}

/* Main container exactly viewport-sized */
.container{width:100vw;height:100vh;display:flex;align-items:stretch;justify-content:stretch}

/* Left 40% / Right 60% */
.left{flex:0 0 40%;position:relative;overflow:hidden;padding-left:20px}
.right{flex:0 0 60%;display:flex;align-items:center;justify-content:center;padding:24px}

/* Left image fills section */
.left .bag{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center left;display:block}

/* Login card (centered inside right) */
.card{width:100%;max-width:580px;background:var(--card);padding:36px;border-radius:16px;box-shadow:0 18px 50px rgba(20,20,20,0.08);position:relative;z-index:2}
.card .brand{display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.card .logo{width:auto}
.card .logo img{height:56px;width:auto;display:block}
.card h1{text-align:left;font-size:28px;margin:6px 0 18px}

form{display:flex;flex-direction:column;gap:20px}
label{font-size:13px;color:var(--text)}
input[type="text"],input[type="password"]{width:100%;height:50px;padding:12px 14px;border:1px solid #eee;border-radius:12px;font-size:16px;-webkit-appearance:none}

.actions{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.btn{height:50px;border-radius:14px;background:linear-gradient(180deg,var(--brand),var(--brand-600));color:#fff;border:none;font-weight:600;font-size:16px;cursor:pointer;-webkit-appearance:none}
.signup-btn{height:50px;border-radius:14px;background:#fff;color:var(--brand-600);border:1px solid var(--brand-600);font-weight:600;cursor:pointer;-webkit-appearance:none}

.socials{display:flex;gap:16px;margin-top:12px}
.social-btn{flex:1;height:48px;border-radius:12px;border:1px solid #eee;background:#fff;display:inline-flex;align-items:center;justify-content:center}

/* Touch / tap friendliness: remove highlight, stabilize focus without layout shifts */
input,button,select,textarea{
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    
}
input:focus,button:focus,select:focus,textarea:focus{
    outline: none;
    box-shadow: 0 0 0 3px rgba(255,138,0,0.12);
}

.note{font-size:13px;color:var(--muted);margin-top:12px}

/* Center right content both vertically and horizontally */
.right{padding:32px;align-items:center;justify-content:center}

/* Responsive: stack on smaller screens and hide large promo */
@media (max-width:900px){
    .left{display:none}
    .right{flex:1;padding:20px}
    .container{width:100vw;height:100vh}
    .card{max-width:560px;padding:32px;border-radius:14px}
}

/* Preserve layout for common laptop width ~1024px */
@media (min-width:1000px) and (max-width:1100px){
    /* 1024px-focused rule: set left/right split as requested (left 58% / right 42%) */
    .left{flex:0 0 58%}
    .right{flex:0 0 42%}
    .card{max-width:560px;padding:32px}
    .left .bag{object-position:24% center}
}

/* Larger laptop / wide screens adjustments */
@media (min-width:1200px){
    /* give the left more room on wide laptops */
    .left{flex:0 0 42%}
    .right{flex:0 0 58%}
    .card{max-width:600px}
    .left .bag{object-position:28% center}
}

@media (min-width:1600px){
    .left{flex:0 0 45%}
    .right{flex:0 0 55%}
    .card{max-width:640px;padding:40px}
    .left{padding-left:40px}
    .left .bag{object-position:32% center}
}

/* Ultra-wide / 2560px */
@media (min-width:2200px){
    .left{flex:0 0 48%}
    .right{flex:0 0 52%}
    .card{max-width:720px;padding:44px}
    .left .bag{object-position:36% center}
}

/* Target exact ultra-wide 2560px to adjust only the image position (no other layout changes) */
@media (min-width:2560px){
    .left .bag{object-position:40% center}
}

@media (max-width:420px){
    .card{padding:28px;border-radius:14px}
    form{gap:16px}
    input[type="text"],input[type="password"]{height:48px}
    .btn,.signup-btn{height:48px}
    .socials{flex-direction:column}
}
        </style>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
    <div class="container">
        <section class="left">
            <img class="bag" src="assets/images/hero.jpeg" alt="Grocery bag illustration">
        </section>

        <section class="right">
            <div class="card">
                <div class="brand">
                    <span class="logo" aria-hidden="true">
                        <img src="assets/images/logo.jpeg" alt="Squirry logo">
                    </span>
                </div>
                <h1>Welcome Back!</h1>
                <form>
                    <label for="mobile">Mobile number</label>
                    <input id="mobile" type="text" placeholder="+91 - Enter mobile number" aria-label="mobile number">

                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter password" aria-label="password">

                    <div class="actions">
                        <button class="btn" type="submit">Login</button>
                        <button class="signup-btn" type="button">Sign Up</button>
                    </div>
                </form>

                <!-- Social buttons removed per request -->
            </div>
        </section>
    </div>
    <script src="js/app.js"></script>
    </body>
    </html>
